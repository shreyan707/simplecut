[package]
name = "simplecut-ui"
description = "SimpleCut's window: library, preview, timeline and toolbar (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
simplecut-core = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
log = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
# the test harness starts eframe, which needs a renderer compiled in
eframe = { workspace = true, features = ["glow"] }
